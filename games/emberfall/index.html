    // shops keep some lights on during the day so the storefronts read as occupied
    float lit = step(rh, litP) * (shop ? max(uNight, 0.45) : uNight);
    float dayAmb = luma(uSkyAmb.rgb) * uSkyAmb.w * 1.0 + luma(uSunColor.rgb) * 0.08 * uSunDir.w;
    // frame / mullions on the glass plane
    vec2 gs = w1 - w0; vec2 gq = q - w0;
    float edge = min(min(gq.x, gs.x - gq.x), min(gq.y, gs.y - gq.y));
    float fw = b.type < 0.5 ? 0.0 : (ground ? 0.06 : 0.045);
    float frame = 1.0 - smoothstep(fw - px, fw + px, edge);
    if (!ground && b.type > 0.5 && gs.x > 1.15) frame = max(frame, 1.0 - smoothstep(0.02 - px, 0.02 + px, abs(gq.x - gs.x * 0.5)));
    if (!ground && b.type > 0.5 && hash12(vec2(b.seed, 5.0)) > 0.5) frame = max(frame, 1.0 - smoothstep(0.018 - px, 0.018 + px, abs(gq.y - gs.y * 0.68)));
    if (ground) frame = max(frame, 1.0 - smoothstep(0.03 - px, 0.03 + px, abs(gq.y - (gs.y - 0.55))));
    // curtain-wall spandrel + transoms
    float spandrel = 0.0;
    if (b.type < 0.5 && !ground) {
      float ffq = q.y / b.fh;
      spandrel = step(0.80, ffq) + step(ffq, 0.07);
      frame = max(frame, 1.0 - smoothstep(0.022 - px, 0.022 + px, min(abs(q.y - 0.07 * b.fh), abs(q.y - 0.80 * b.fh))));
    }
    vec3 rd = normalize(vec3(-Vt.x, -Vt.y, -Vt.z));
    float glow;
    vec3 icol = interiorColor(q, rd, pitch, b.fh, roomId, lit, dayAmb, shop, office, glow);
    // blinds / curtains
    float ch = hash12(roomId + 7.3 + b.seed);
    float cover = 0.0; vec3 ccol = vec3(0.8, 0.77, 0.7);
    if (!shop) {
      float yy = gq.y / gs.y, xx = gq.x / gs.x;
      if (ch < mix(0.32, 0.22, office)) { float c = 0.2 + 0.7 * hash12(roomId + 2.1); cover = step(1.0 - c, yy); ccol = mix(vec3(0.82, 0.8, 0.74), vec3(0.6, 0.62, 0.64), office) * (0.9 + 0.1 * step(0.5, fract(yy * gs.y * 22.0))); }
      else if (ch < mix(0.62, 0.25, office)) { float o = 0.12 + 0.3 * hash12(roomId + 9.9); cover = step(xx, o) + step(1.0 - o, xx); ccol = mix(vec3(0.78, 0.72, 0.62), 0.35 + 0.5 * hash32(roomId + 5.5), 0.45) * (0.82 + 0.18 * sin(xx * gs.x * 55.0)); }
    }
    vec3 interior = mix(icol, ccol * (dayAmb * 0.55 + lit * 0.75), cover);
    interior *= lightTint(roomId, office) * step(0.5, lit) + (1.0 - step(0.5, lit));
    float F = b.glassRefl + (1.0 - b.glassRefl) * pow(clamp(1.0 - Vt.z / max(length(Vt), 1e-4), 0.0, 1.0), 5.0);
    vec3 trans = mix(vec3(1.0), b.glassTint, 0.6) * (1.0 - F) * (1.0 - 0.6 * b.glassRefl);
    // recess self-shadow from the sun on the glass
    float sh = 1.0;
    if (Lt.z > 0.0) { vec2 e = q + Lt.xy / Lt.z * D; float m = min(min(e.x - w0.x, w1.x - e.x), min(e.y - w0.y, w1.y - e.y)); sh = smoothstep(-0.01, 0.02, m); }
    else sh = 0.0;
    s.shadowMul = sh;
    bool broken = damage > 0.5;
    if (broken) {
      // jagged remains of the pane near the frame
      float jag = texture(uNoise, q * 1.7 + roomId * 0.37).b;
      float keep = step(edge, 0.05 + 0.28 * jag * jag);
      s.albedo = mix(vec3(0.015), b.glassTint * b.glassRefl, keep);
      s.metallic = keep; s.rough = mix(1.0, 0.06, keep);
      s.emissive = interior * mix(0.55, 0.3, keep) * (1.0 - spandrel);
      s.ao = mix(0.35, 1.0, keep);
    } else {
      float dirt = 0.5 * n2 + 0.5 * n1;
      s.albedo = b.glassTint * max(b.glassRefl, 0.04);
      s.metallic = 1.0;
      s.rough = 0.025 + 0.05 * dirt * dirt;
      s.emissive = interior * trans * (1.0 - spandrel);
      if (spandrel > 0.5) { s.albedo = b.glassTint * max(b.glassRefl, 0.04) * 0.8 + 0.01; s.rough = 0.08 + 0.1 * dirt; }
    }
    // frame
    vec3 fcol = b.type > 2.5 || b.type < 0.5 ? vec3(0.07, 0.075, 0.08) : mix(vec3(0.75, 0.74, 0.72), b.accent, 0.5);
    if (b.type < 0.5) fcol = vec3(0.35, 0.36, 0.38);
    s.albedo = mix(s.albedo, fcol, frame); s.metallic = mix(s.metallic, b.type < 0.5 ? 0.9 : 0.3, frame);
    s.rough = mix(s.rough, 0.42, frame); s.emissive *= (1.0 - frame);
    s.ao = min(s.ao, mix(0.75, 1.0, smoothstep(0.0, 0.25, edge)));
  } else {
    // ---------------- wall / reveal ----------------
    vec3 wc = b.wallCol; float rough = b.wallRough;
    float wear = 1.0;
    if (ground) {
      // storefront piers + fascia / sign band
      wc = mix(b.wallCol * 0.42, b.accent * 0.5, 0.35); rough = 0.55;
      float band = step(b.fh * 0.74, pm.y) * step(pm.y, b.fh * 0.95);
      float so = floor(hash12(vec2(b.seed, faceSeed)) * 3.0);
      float shopCell = ci + so;
      float shopId = floor(shopCell / 3.0);
      float sx = (mod(shopCell, 3.0) * 3.0 + pm.x) / 9.0;
      float hs = hash12(vec2(shopId, b.seed + faceSeed));
      if (band > 0.5 && hs < 0.8 && sx > 0.03 && sx < 0.97) {
        vec3 signCol = mix(hue2rgb(hash12(vec2(shopId + 3.0, b.seed))), vec3(1.0), 0.25);
        float gy = (pm.y - b.fh * 0.74) / (b.fh * 0.21);
        float lx = sx * 26.0;
        float glyph = step(0.38, hash12(vec2(floor(lx), shopId + b.seed))) * step(0.2, fract(lx)) * step(0.3, gy) * step(gy, 0.72) * step(0.2, sx) * step(sx, 0.8);
        vec3 base = hs < 0.4 ? vec3(0.03) : signCol * 0.25;
        vec3 lettering = hs < 0.4 ? signCol : vec3(0.95);
        wc = mix(base, lettering, glyph); rough = 0.4;
        s.emissive = (lettering * glyph * 5.0 + base * 0.6) * uNight;
      }
      wc *= mix(0.55, 1.0, smoothstep(0.0, 1.2, v + n1 * 0.6));
    } else if (b.type < 0.5) {
      wc = vec3(0.34, 0.35, 0.37); rough = 0.4; s.metallic = 0.9;
    } else if (b.type < 1.5) {
      // precast concrete panels
      float joint = min(min(pm.x, pitch - pm.x), min(pm.y, b.fh - pm.y));
      wc *= 0.86 + 0.28 * n1;
      wc *= mix(0.6, 1.0, smoothstep(0.0, 0.02 + px, joint));
      vec2 th = abs(fract(vec2(pm.x / pitch, pm.y / b.fh) * 2.0 + 0.5) - 0.5) * vec2(pitch, b.fh) * 0.5;
      wc *= mix(0.72, 1.0, smoothstep(0.02, 0.03 + px, length(th)));
      Nt.xy += (n2 - 0.5) * 0.06;
    } else if (b.type < 2.5) {
      // brick
      vec2 bu = vec2(u / 0.235, v / 0.078);
      float row = floor(bu.y); bu.x += 0.5 * mod(row, 2.0);
      vec2 bid = floor(bu), bf = fract(bu);
      float fade = saturate(1.3 - fwidth(bu.y) * 2.2);
      float mx = smoothstep(0.035, 0.07, bf.x) * smoothstep(0.035, 0.07, 1.0 - bf.x);
      float my = smoothstep(0.09, 0.2, bf.y) * smoothstep(0.09, 0.2, 1.0 - bf.y);
      float brick = mx * my;
      vec3 bc = b.wallCol * (0.72 + 0.56 * hash12(bid + b.seed)) * (0.9 + 0.2 * n2);
      bc = mix(bc, bc.grb * 0.9, 0.25 * hash12(bid * 1.7));
      vec3 mc = vec3(0.56, 0.54, 0.5) * (0.9 + 0.2 * n2);
      wc = mix(mix(b.wallCol * 0.97, mc, 0.16), mix(mc, bc, brick), fade);
      Nt.y += fade * 0.35 * (smoothstep(0.2, 0.0, bf.y) - smoothstep(0.8, 1.0, bf.y));
      Nt.x += fade * 0.25 * (smoothstep(0.07, 0.0, bf.x) - smoothstep(0.93, 1.0, bf.x));
      rough = mix(0.9, 0.82, brick);
      // stone lintel + sill
      float inX = step(w0.x - 0.12, pm.x) * step(pm.x, w1.x + 0.12);
      float lint = inX * (step(w1.y, pm.y) * step(pm.y, w1.y + 0.2) + step(w0.y - 0.11, pm.y) * step(pm.y, w0.y));
      wc = mix(wc, vec3(0.66, 0.63, 0.58) * (0.85 + 0.3 * n1), lint); 
    } else {
      // stucco / render with slab bands
      wc *= 0.9 + 0.2 * n1;
      float band = step(pm.y, 0.16);
      wc = mix(wc, mix(b.accent, vec3(0.8), 0.3) * (0.85 + 0.2 * n1), band * 0.85);
      float inX = step(w0.x - 0.06, pm.x) * step(pm.x, w1.x + 0.06);
      float sill = inX * step(w0.y - 0.07, pm.y) * step(pm.y, w0.y);
      wc = mix(wc, vec3(0.7), sill * 0.8);
      Nt.xy += (n2 - 0.5) * 0.1;
    }
    // weathering: streaks from the top and below openings, base grime
    float below = step(pm.y, w0.y) * step(w0.x, pm.x) * step(pm.x, w1.x);
    if (!ground && b.type > 0.5) {
      wear = mix(1.0, 0.7 + 0.3 * streak, 0.75);
      wear *= 1.0 - 0.22 * below * smoothstep(0.35, 0.75, streak) * smoothstep(w0.y - 1.0, w0.y, pm.y);
      wear *= mix(0.8, 1.0, smoothstep(b.H, b.H - 3.0 - 6.0 * streak, v));
    }
    if (v > b.H) {
      // parapet coping
      float cop = step(b.H + 0.82, v);
      wc = mix(wc, vec3(0.5, 0.51, 0.52), cop); s.metallic = mix(s.metallic, 0.8, cop); rough = mix(rough, 0.4, cop);
    }
    s.albedo = wc * wear; s.rough = rough;
    if (inOpen) {
      // side of the recess (reveal)
      Nt = revealN; s.ao = mix(0.45, 0.95, saturate(revealT));
      s.albedo *= 0.9;
      // crude sun occlusion inside the recess
      float depthHere = revealT * D;
      if (Lt.z > 0.0) { vec2 e = pm + (-Vt.xy / Vt.z) * depthHere + Lt.xy / Lt.z * depthHere; float m = min(min(e.x - w0.x, w1.x - e.x), min(e.y - w0.y, w1.y - e.y)); s.shadowMul = smoothstep(-0.02, 0.02, m) ; }
    }
  }
  s.N = normalize(T * Nt.x + vec3(0.0, 1.0, 0.0) * Nt.y + nL * Nt.z);
}

// Complete surface for any face of any piece. kind: 0 wall, 1 slab, 2 column, 3 roof prop, 4 rubble
void neonFacade(BP b, vec3 p, vec3 nL, inout Surf s){
  float u = abs(nL.x) > 0.5 ? p.z : p.x; float hw = abs(nL.x) > 0.5 ? b.hs.z : b.hs.x;
  vec3 c1 = hue2rgb(fract(b.seed * 0.37)), c2 = hue2rgb(fract(b.seed * 0.37 + 0.42));
  float edge = smoothstep(0.17, 0.05, abs(hw - abs(u) - 0.42));
  float fl = p.y / b.fh;
  float band = smoothstep(0.11, 0.03, abs((fract(fl / 4.0) - 0.07) * 4.0 * b.fh)) * step(0.9, fl);
  float flick = 0.86 + 0.14 * sin(uTime * 6.0 + b.seed * 9.0) * step(0.8, fract(b.seed * 3.1));
  float k = (0.22 + 0.78 * uNight) * flick;
  float m = max(edge, band);
  s.emissive += (c1 * edge + c2 * band) * 9.0 * k;
  s.albedo = mix(s.albedo, vec3(0.03), m * 0.8);
}
void pieceSurface(BP b, vec3 p, vec3 nL, vec3 Vl, vec3 Ll, float kind, float damage, float dyn, out Surf s){
  s.metallic = 0.0; s.emissive = vec3(0.0); s.ao = 1.0; s.shadowMul = 1.0; s.N = nL;
  vec2 fc = abs(nL.y) > 0.5 ? p.xz : (abs(nL.x) > 0.5 ? p.zy : p.xy);
  float n1 = texture(uNoise, fc * 0.11 + b.seed).r;
  float n2 = texture(uNoise, fc * 0.9).g;
  // default: fractured concrete / masonry core \u2014 fine aggregate speckle, tinted by the wall material
  float agg = texture(uNoise, fc * 2.7 + 0.37).g;
  s.albedo = vec3(0.31, 0.3, 0.285) * (0.7 + 0.6 * n1) * (0.78 + 0.44 * agg) * (0.9 + 0.2 * n2);
  s.albedo = mix(s.albedo, b.wallCol * (0.42 + 0.3 * agg) * (0.75 + 0.5 * n1), b.type > 1.5 && b.type < 2.5 ? 0.6 : 0.25);
  s.rough = 0.95;
  if (kind < 0.5) {
    bool xo = abs(nL.x) > 0.5 && abs(abs(p.x) - b.hs.x) < 0.03 && p.x * nL.x > 0.0;
    bool zo = abs(nL.z) > 0.5 && abs(abs(p.z) - b.hs.z) < 0.03 && p.z * nL.z > 0.0;
    bool xi = abs(nL.x) > 0.5 && abs(abs(p.x) - (b.hs.x - b.wt)) < 0.03 && p.x * nL.x < 0.0;
    bool zi = abs(nL.z) > 0.5 && abs(abs(p.z) - (b.hs.z - b.wt)) < 0.03 && p.z * nL.z < 0.0;
    if (xo || zo) { facadeOuter(b, p, nL, Vl, Ll, damage, s); if (b.gtype > 0.5 && damage < 0.5) neonFacade(b, p, nL, s); return; }
    if (xi || zi) {
      // inside face: plaster + the window seen from the inside
      vec3 no = -nL; float u, L; vec3 T;
      facadeFrame(b, p, no, u, T, L);
      float ci, fi, D; vec2 pm, w0, w1; bool ground;
      facadeCell(b, u, p.y, no.x * 3.0 + no.z * 7.0, ci, fi, pm, w0, w1, D, ground);
      bool inOpen = pm.x > w0.x && pm.x < w1.x && pm.y > w0.y && pm.y < w1.y;
      s.albedo = vec3(0.66, 0.64, 0.6) * (0.85 + 0.25 * n1); s.rough = 0.9;
      if (inOpen) { s.albedo = vec3(0.02); s.rough = 0.1; s.emissive = uSkyAmb.rgb * uSkyAmb.w * 1.6 + uSunColor.rgb * 0.05; }
      return;
    }
    return;
  }
  if (kind < 1.5) {
    if (nL.y > 0.5) {
      if (p.y > b.H - 0.06) {
        // roof: gravel / membrane with stains
        float g = texture(uNoise, p.xz * 1.3).g;
        float st = texture(uNoise, p.xz * 0.05 + b.seed).a;
        s.albedo = mix(vec3(0.23, 0.225, 0.22), vec3(0.34, 0.33, 0.31), g) * (0.75 + 0.5 * st);
        s.rough = 0.92;
        s.N = normalize(vec3((g - 0.5) * 0.25, 1.0, (n2 - 0.5) * 0.25));
      } else {
        vec2 tl = abs(fract(p.xz / 0.6) - 0.5);
        s.albedo = mix(vec3(0.2, 0.19, 0.18), vec3(0.27, 0.25, 0.23), n1) * (0.9 + 0.1 * step(0.02, min(0.5 - tl.x, 0.5 - tl.y)));
        s.rough = 0.8;
      }
    } else if (nL.y < -0.5) {
      // ceiling with light panels
      vec2 g = p.xz / vec2(1.2, 0.6); vec2 gf = fract(g), gid = floor(g);
      float line = step(0.02, gf.x) * step(0.04, gf.y);
      s.albedo = vec3(0.72) * (0.92 + 0.08 * line);
      float fi = floor((p.y - 0.1) / b.fh);
      float lit = step(hash12(vec2(fi, b.seed + 5.0)), 0.55) * uNight * (1.0 - dyn);
      float panel = step(0.5, hash12(gid * 0.37 + b.seed)) * step(mod(gid.x, 2.0), 0.5) * step(mod(gid.y, 4.0), 0.5) * line;
      s.emissive = vec3(1.0, 0.93, 0.82) * 6.0 * panel * lit;
      s.rough = 0.85;
    }
    return;
  }
  if (kind < 2.5) { s.albedo = vec3(0.5, 0.49, 0.47) * (0.8 + 0.4 * n1); s.rough = 0.8; return; }
  if (kind < 3.5) {
    // rooftop machinery
    s.albedo = vec3(0.5, 0.51, 0.53) * (0.8 + 0.3 * n1); s.metallic = 0.75; s.rough = 0.45;
    if (abs(nL.y) < 0.5) { float lou = step(0.5, fract(p.y * 9.0)); float m = step(0.12, fract(fc.x * 0.45)) ; s.albedo *= mix(1.0, 0.35 + 0.65 * lou, m * 0.8); }
    else { float fan = length(fract(p.xz * 0.6) - 0.5); s.albedo *= mix(0.3, 1.0, smoothstep(0.3, 0.33, fan)); }
    return;
  }
  if (kind > 4.5 && kind < 5.5) {
    // shop awning: striped canvas, one colour per shop
    bool xw = abs(p.x) > b.hs.x - 0.01;
    float al = xw ? p.z : p.x;
    float shop = floor((al + 300.0) / 3.0);
    vec3 hue = hue2rgb(hash12(vec2(shop, b.seed)));
    vec3 colA = mix(hue, vec3(0.45), 0.4) * 0.5, colB = vec3(0.7, 0.68, 0.62);
    float stripe = step(0.5, fract(al / 0.46)) * step(0.35, hash12(vec2(shop, 3.0 + b.seed)));
    s.albedo = mix(colA, colB, stripe) * (0.8 + 0.35 * n1) * (nL.y < -0.5 ? 0.6 : 1.0);
    s.rough = 0.85;
    return;
  }
  if (kind > 5.5) {
    // cornice / ledge: weathered stone
    s.albedo = mix(vec3(0.6, 0.58, 0.54), b.wallCol, 0.3) * (0.75 + 0.45 * n1) * (0.9 + 0.2 * n2);
    s.rough = 0.8;
    if (b.gtype > 0.5) { s.albedo = vec3(0.04); s.emissive = hue2rgb(fract(b.seed * 0.37 + 0.2)) * 7.0 * (0.22 + 0.78 * uNight); }
    return;
  }
  // rubble: concrete tinted by the wall colour
  s.albedo = mix(s.albedo, b.wallCol * (0.6 + 0.5 * n1), 0.45);
}

// Cheap facade for the reflection proxy: returns albedo + emissive, glass flag
void facadeLite(BP b, vec3 p, vec3 nL, out vec3 albedo, out vec3 emissive, out float glass){
  float u, L; vec3 T;
  facadeFrame(b, p, nL, u, T, L);
  float v = p.y;
  float faceSeed = nL.x * 3.0 + nL.z * 7.0;
  float ci, fi, D; vec2 pm, w0, w1; bool ground;
  float pitch = facadeCell(b, u, v, faceSeed, ci, fi, pm, w0, w1, D, ground);
  bool inOpen = pm.x > w0.x && pm.x < w1.x && pm.y > w0.y && pm.y < w1.y;
  emissive = vec3(0.0); glass = 0.0;
  albedo = b.wallCol * 0.9;
  if (ground) albedo = mix(b.wallCol * 0.42, b.accent * 0.5, 0.35);
  if (b.type < 0.5 && !ground) albedo = vec3(0.34, 0.35, 0.37);
  if (inOpen) {
    vec2 roomId = vec2(ci, fi) + faceSeed * 13.0;
    float office = b.type < 0.5 ? 1.0 : 0.0;
    float rh = hash12(roomId + b.seed);
    float floorLit = hash12(vec2(fi, b.seed + faceSeed));
    float litP = ground ? 0.75 : mix(b.litFrac, b.litFrac * 0.5 + 0.6 * step(0.45, floorLit), office);
    float lit = step(rh, litP) * uNight;
    float ff = pm.y / b.fh;
    float spandrel = (b.type < 0.5 && !ground) ? step(0.80, ff) + step(ff, 0.07) : 0.0;
    glass = 1.0;
    albedo = b.glassTint * max(b.glassRefl, 0.04);
    emissive = roomTint(roomId) * lightTint(roomId, office) * lit * 0.75 * (1.0 - spandrel) * (1.0 - 0.6 * b.glassRefl);
  }
}
`;var Ht=`
uniform sampler2D uGA, uGN, uGE, uGM, uDepth;
`,He=`
uniform sampler2D uCityMap;   // RGBA8 nearest: r = height (0.5 m units), g = building id + 1, b = footprint
uniform sampler2D uCityBlur;  // R8 trilinear: height
vec2 cityUV(vec2 xz){ return xz * uCity.z + 0.5; }
float cityH(vec2 xz){ return textureLod(uCityMap, cityUV(xz), 0.0).r * 127.5; }
float cityHBlur(vec2 xz, float lod){ return textureLod(uCityBlur, cityUV(xz), lod).r * 127.5; }
// large-scale sky visibility of a point with normal N (street canyons are darker than roofs)
float skyVis(vec3 wp, vec3 N){
  vec3 p = wp + N * 1.5;
  float h1 = cityHBlur(p.xz + N.xz * 6.0, 3.0), h2 = cityHBlur(p.xz + N.xz * 14.0, 5.0), h0 = cityHBlur(p.xz, 0.5);
  float occ = saturate((h1 - p.y) / 26.0) * 0.38 + saturate((h2 - p.y) / 36.0) * 0.42;
  float inside = smoothstep(0.5, 2.5, h0 - p.y);
  return max((1.0 - occ) * mix(1.0, 0.3, inside), 0.12);
}
float cityShadow(vec3 p, vec3 L){
  float t = 1.2, s = 1.0;
  for (int i = 0; i < 10; i++) {
    vec3 q = p + L * t;
    if (q.y < cityH(q.xz)) { s = 0.0; break; }
