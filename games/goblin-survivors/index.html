    <script>
      // the loading screen's bar follows the game's own count of its art; at the end it fades away

        function set(part) { boot.style.setProperty('--p', (0.07 + 0.93 * part).toFixed(3)) }
        function end() {

        function show() { inner.classList.add('on'); requestAnimationFrame(function () { if (!over) set(0) }) }
        function one() { if (--left === 0) show() }
        imgs.forEach(function (im) { if (im.complete) one(); else { im.addEventListener('load', one); im.addEventListener('error', one) } })
        setTimeout(show, 1500)
