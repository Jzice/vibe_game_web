<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":54357160,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');
  const meta = document.getElementById('meta');
  const notice = document.getElementById('status-notice');
  status.style.visibility = 'visible';

  function fail(err) {
    console.error(err);
    bar.style.display = 'none'; meta.style.display = 'none';
    notice.style.display = 'block';
    notice.textContent = (err && err.message) ? err.message : String(err || 'An unknown error occurred.');
  }

  // Touch-only devices: the game needs a keyboard, so skip the ~90 MB download.
  const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches;
  if (touchOnly && !/[?&]force=1/.test(location.search)) {
    bar.style.display = 'none';
    meta.innerHTML = '<span style="color:#e9eef2;font-size:17px;font-weight:600">GoKart Mania needs a keyboard.</span><br>Open <b style="color:#e9eef2">gokart-mania.vercel.app</b> on a desktop or laptop to race.<br><br><a href="?force=1" style="color:#8a96a3">Load anyway (90 MB)</a>';
    meta.style.lineHeight = '1.7';
    document.querySelector('.logo .mark').style.animationPlayState = 'paused';
    return;
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail('Your browser is missing features this game needs:\n' + missing.join(', ') + '\nTry a recent desktop Chrome, Edge, Firefox or Safari.');
    return;
  }

  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        bar.classList.remove('indeterminate');
        const pct = Math.min(100, (current / total) * 100);
        fill.style.width = pct.toFixed(1) + '%';
        meta.textContent = Math.round(pct) + '%  ·  ' + (current / 1048576).toFixed(0) + ' / ' + (total / 1048576).toFixed(0) + ' MB';
        if (current >= total) meta.textContent = 'Starting engine…';
      }
    },
  }).then(() => {
    status.classList.add('fade');
    setTimeout(() => status.remove(), 500);
  }, fail);
}());
</script>
